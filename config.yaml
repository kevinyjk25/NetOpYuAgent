# NetOpYu DSH plugin configuration.
mode: mock

agent:
  agent_id: lan-agent
  profile: lan
  peers: []

tools:
  schema_validation_enabled: true
  mcp:
    config_json: ""
  openapi:
    spec_url: ""
    base_url: ""
    auth_type: bearer
    token_env: NETOPS_API_TOKEN
  editable_hitl_tools:
    edit_device_config: [config_lines, reason]
    rollback_deploy: [snapshot_id, reason]
    restart_service: [service_name, graceful]
    push_config: [config_lines, reason]
    dc_grant_app_access: [role, reason]
    dc_revoke_app_access: [reason]
    dc_config_push: [config_lines, reason]
    grant_user_access: [reason]
    revoke_user_access: [reason]

pragmatic:
  device_inventory: []
  mcp_servers: []
  napalm_getters: [get_facts, get_interfaces, get_interfaces_counters]
  # P0.75-A local FRR lab. Enable only after `scripts/netopyu-lab preflight`
  # passes and the topology has been deployed. Lab mode never falls back to
  # mock data or a real device inventory.
  lab:
    enabled: false
    provider: containerlab
    manifest: labs/p075-a-frr/lab.yaml
    command_timeout: 30

retrieval:
  backend: bm25
  cache:
    enabled: false
    max_entries: 1024
    ttl_seconds: 600
  hybrid:
    bm25_weight: 0.5
    embed_weight: 0.5
    fusion: weighted_sum
    rrf_k: 60
    oversample: 4
  llm_judge:
    first_stage_top_k: 15
    timeout_seconds: 10
    fusion_alpha: 0.3
    max_text_chars: 200
  embed_index_concurrency: 8

embeddings:
  dim: 768
