# P1.8-C deterministic Skill-preload and single-capture overlay.
#
# The evaluator, not the model, validates and preloads the reviewed L1 Skill.
# The only model-facing Tool records one proposal. No Runtime, Provider, shell,
# filesystem Tool, Web, subagent, approval, or network effect is available.

- insert:
    - id: l1-protocol-controller
      name: __NETOPYU_L1_PROTOCOL_CONTROLLER_PLUGIN__
      config:
        preloadedSkillDigest: !!js process.env.NETOPYU_L1_PRELOADED_SKILL_DIGEST

- id: system-prompt
  config:
    persona: !!js process.env.NETOPYU_L1_CONTROLLED_SYSTEM_PROMPT

