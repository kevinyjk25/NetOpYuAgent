      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    interface:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    vlan_id:
      type: integer
      required: true
      description: ''
      enum: []
      minimum: 1.0
      maximum: 4094.0
      minLength: null
      maxLength: null
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    reason:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
