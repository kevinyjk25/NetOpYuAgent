# Agentized external-system demo. Each domain is a real MCP stdio process;
# business records are simulated in one transactional local SQLite database.
mode: pragmatic
agent:
  agent_id: enterprise-access-agent
  profile: lan
  peers: []
tools:
  schema_validation_enabled: true
  mcp: {config_json: ''}
  openapi: {spec_url: '', base_url: ''}
  editable_hitl_tools:
    access_policy_grant_entitlement: [role, change_id, expected_revision, reason]
pragmatic:
  device_inventory: []
  mcp_servers:
    - name: identity-service
      domain: service
      transport: stdio
      command: [.venv/bin/python, -m, service_layer.mcp_server, --domain, identity, --store, data/agentized_service_layer.sqlite]
      expected_server_name: netopyu.identity
      expected_server_version: 1.0.0
    - name: application-service
      domain: service
      transport: stdio
      command: [.venv/bin/python, -m, service_layer.mcp_server, --domain, application, --store, data/agentized_service_layer.sqlite]
      expected_server_name: netopyu.application
      expected_server_version: 1.0.0
    - name: change-service
      domain: service
      transport: stdio
      command: [.venv/bin/python, -m, service_layer.mcp_server, --domain, change, --store, data/agentized_service_layer.sqlite]
      expected_server_name: netopyu.change
      expected_server_version: 1.0.0
    - name: access-policy-service
      domain: service
      transport: stdio
      command: [.venv/bin/python, -m, service_layer.mcp_server, --domain, access-policy, --store, data/agentized_service_layer.sqlite]
      trusted_for_writes: true
      expected_server_name: netopyu.access-policy
      expected_server_version: 1.0.0
  lab:
    enabled: false
    provider: containerlab
    manifest: labs/p075-b-small-production/lab.yaml
    command_timeout: 30
