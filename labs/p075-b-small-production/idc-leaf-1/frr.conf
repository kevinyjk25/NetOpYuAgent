frr version 10.3
frr defaults traditional
hostname idc-leaf-1
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description TO_CORE1_PRIMARY
 ip address 10.0.0.38/30
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf hello-interval 3
 ip ospf dead-interval 12
!
interface eth2
 description TO_CORE2_BACKUP
 ip address 10.0.0.42/30
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf hello-interval 3
 ip ospf dead-interval 12
!
interface eth3
 description CRM_PRODUCTION_VLAN210
 ip address 10.20.10.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth4
 description WIKI_COLLABORATION_VLAN220
 ip address 10.20.20.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth5
 description INFRA_MONITORING_VLAN230
 ip address 10.20.30.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
router ospf
 ospf router-id 7.7.7.7
!
