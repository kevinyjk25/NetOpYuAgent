apiVersion: netopyu.io/l0-effect/v2
kind: AtomicEffect
metadata:
  id: network.dc.fabric-config.push
  version: 1.0.0
  owner: netopyu-runtime
  description: Production L0 v2 contract for dc_config_push
  labels:
    runtime-tool-contract: dc-config-v2
    runtime-verifier: dc-config
    runtime-preflight-fields: node
    migration-source: l0-v1-reviewed
spec:
  template: netopyu-runtime-v2
  profiles:
  - dc
  effect:
    capability: netopyu.tool.dc_config_push
    tool: dc_config_push
    request:
      node: ${arguments.node}
      config_lines: ${arguments.config_lines}
      reason: ${arguments.reason}
  intent:
    kind: configure_fabric
    targetFields:
    - node
    desiredState:
      requested_configuration_digest: ${intent.configuration_digest}
  parameters:
    node:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    config_lines:
      type: array
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: 1
      maxLength: 500
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    reason:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: 1
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
  preflight:
  - id: approved-state
    capability: netopyu.tool.dc_get_applied_config
    arguments:
      node: ${arguments.node}
    snapshotFields:
    - facts
    predicates:
    - field: facts
      operator: exists
  verification:
    capability: netopyu.verifier.dc-config
    arguments:
      node: ${arguments.node}
    predicates:
    - field: passed
      operator: equals
      expected: true
  compensation: null
  approval:
    required: true
    risk: high
    mode: single
  failurePolicy:
    beforeSend: abort
    afterSendUnknown: reconcile_read_only
    verificationFailed: manual_intervention
    compensationFailed: manual_intervention
