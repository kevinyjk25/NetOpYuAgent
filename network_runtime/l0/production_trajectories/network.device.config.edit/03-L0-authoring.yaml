apiVersion: netopyu.io/l0-effect/v2
kind: AtomicEffect
metadata:
  id: network.device.config.edit
  version: 1.0.0
  owner: netopyu-runtime
  description: Production L0 v2 contract for edit_device_config
  labels:
    runtime-tool-contract: device-config-v1
    runtime-verifier: device-config
    runtime-preflight-fields: device_id,section
    migration-source: l0-v1-reviewed
spec:
  template: netopyu-runtime-v2
  profiles:
  - lan
  - dc
  effect:
    capability: network.device.config.edit
    tool: edit_device_config
    request:
      device_id: ${arguments.device_id}
      section: ${arguments.section}
      changes: ${arguments.changes}
      config_lines: ${arguments.config_lines}
      reason: ${arguments.reason}
      verification_probe_id: ${arguments.verification_probe_id}
  intent:
    kind: configure_device
    targetFields:
    - device_id
    desiredState:
      requested_configuration_digest: ${intent.configuration_digest}
  parameters:
    device_id:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    section:
      type: string
      required: false
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    changes:
      type: object
      required: false
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: null
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    config_lines:
      type: array
      required: false
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: 1
      maxLength: 500
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    reason:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: 1
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    verification_probe_id:
      type: string
      required: false
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
  preflight:
  - id: approved-state
    capability: network.device.config.get
    arguments:
      device_id: ${arguments.device_id}
      section: ${arguments.section}
    snapshotFields:
    - facts
    predicates:
    - field: facts
      operator: exists
  verification:
    capability: netopyu.verifier.device-config
    arguments:
      device_id: ${arguments.device_id}
    predicates:
    - field: passed
      operator: equals
      expected: true
  compensation:
    capability: network.device.config.restore
    tool: restore_device_config
    arguments:
      device_id: ${arguments.device_id}
    verification:
      capability: netopyu.rollback-verifier.device-config-snapshot-v1
      arguments:
        device_id: ${arguments.device_id}
        section: ${arguments.section}
      predicates:
      - field: restored
        operator: equals
        expected: true
  approval:
    required: true
    risk: high
    mode: single
  failurePolicy:
    beforeSend: abort
    afterSendUnknown: reconcile_read_only
    verificationFailed: compensate
    compensationFailed: manual_intervention
