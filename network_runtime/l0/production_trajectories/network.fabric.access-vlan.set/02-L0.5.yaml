title: network.fabric.access-vlan.set
purpose: 以精确参数安全执行 network.fabric.access-vlan.set，并通过独立证据验证结果。 / Safely execute network.fabric.access-vlan.set
  with exact inputs and independent evidence.
profiles:
- dc
parameters:
  device_id: 'device_id；必填 / Required string；最长长度 / maximum length: 4096。'
  interface: 'interface；必填 / Required string；最长长度 / maximum length: 4096。'
  vlan_id: 'vlan_id；必填 / Required integer；最小值 / minimum: 1；最大值 / maximum: 4094。'
  reason: 'reason；必填 / Required string；最短长度 / minimum length: 1；最长长度 / maximum length:
    4096。'
  verification_probe_id: 'verification_probe_id；可选 / Optional string；最长长度 / maximum
    length: 4096。'
semanticIntents:
- effectCapability: network.fabric.access-vlan.set
  kind: set_access_vlan
  targetFields:
