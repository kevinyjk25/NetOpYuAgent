# P1.8 DSH-in-the-loop shadow overlay.
#
# The headless bundle still mounts the ordinary DSH Agent/Session/LLM loop, but
# every code, shell, filesystem, network, subagent, Skill, and auxiliary tool
# surface is disabled.  The model can only return assistant text for strict
# offline scoring; it cannot invoke NetOpYu Runtime or any Provider.

- id: system-prompt
  config:
    persona: !!js process.env.NETOPYU_L1_SHADOW_SYSTEM_PROMPT

- id: session-title-llm
  disabled: true
