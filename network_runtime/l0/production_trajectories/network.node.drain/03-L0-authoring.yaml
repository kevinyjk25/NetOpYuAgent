apiVersion: netopyu.io/l0-effect/v2
kind: AtomicEffect
metadata:
  id: network.node.drain
  version: 1.0.0
  owner: netopyu-runtime
  description: Production L0 v2 contract for drain_node
  labels:
    runtime-tool-contract: mock-drain-v2
    runtime-verifier: mock-state
    runtime-preflight-fields: node_id
    migration-source: l0-v1-reviewed
spec:
  template: netopyu-runtime-v2
  profiles:
  - lan
  effect:
    capability: netopyu.tool.drain_node
    tool: drain_node
    request:
      node_id: ${arguments.node_id}
      grace_period_s: ${arguments.grace_period_s}
  intent:
    kind: drain_node
    targetFields:
    - node_id
    desiredState:
      drained: true
      schedulable: false
      pending: 0
      failed: 0
  parameters:
    node_id:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    grace_period_s:
      type: integer
      required: false
      description: ''
      enum: []
      minimum: 0.0
      maximum: 3600.0
      minLength: null
      maxLength: null
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
  preflight:
  - id: approved-state
    capability: netopyu.tool.mock_operation_status
    arguments:
      node_id: ${arguments.node_id}
    snapshotFields:
    - facts
    predicates:
    - field: facts
      operator: exists
  verification:
    capability: netopyu.verifier.mock-state
    arguments:
      node_id: ${arguments.node_id}
    predicates:
    - field: passed
      operator: equals
      expected: true
  compensation: null
  approval:
    required: true
    risk: high
    mode: single
  failurePolicy:
    beforeSend: abort
    afterSendUnknown: reconcile_read_only
    verificationFailed: manual_intervention
    compensationFailed: manual_intervention
