#     # Production path uses cfg.retrieval — these weights are the fallback.
#     purpose_weight:     0.40   # most diagnostic field (raise for tighter match)
#     description_weight: 0.20
#     tags_weight:        0.20   # raise if you have a rich tag taxonomy
#     params_weight:      0.10
#     name_id_weight:     0.10   # tiebreaker
