# P1.8-B2 DSH Skill/tool-call shadow overlay.
#
# The only callable tools are the official `skill` loader and the local
# proposal-only `submit_l1_decision` capture tool.  No Runtime, Provider,
# shell, filesystem tool, Web, subagent, approval, or network effect exists.

- insert:
    - id: l1-shadow-capture
      # The evaluator replaces this exact sentinel with the reviewed absolute
      # module path inside its ephemeral patch before DSH starts.
      name: __NETOPYU_L1_CAPTURE_PLUGIN__

- id: system-prompt
  config:
    persona: !!js process.env.NETOPYU_L1_TOOL_SHADOW_SYSTEM_PROMPT

