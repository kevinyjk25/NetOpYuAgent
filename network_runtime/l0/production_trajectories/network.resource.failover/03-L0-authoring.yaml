apiVersion: netopyu.io/l0-effect/v2
kind: AtomicEffect
metadata:
  id: network.resource.failover
  version: 1.0.0
  owner: netopyu-runtime
  description: Production L0 v2 contract for failover
  labels:
    runtime-tool-contract: mock-failover-v2
    runtime-verifier: mock-state
    runtime-preflight-fields: resource_id
    migration-source: l0-v1-reviewed
spec:
  template: netopyu-runtime-v2
  profiles:
  - lan
  effect:
    capability: netopyu.tool.failover
    tool: failover
    request:
      resource_id: ${arguments.resource_id}
      target: ${arguments.target}
  intent:
    kind: failover_resource
    targetFields:
    - resource_id
    desiredState:
      primary: ${arguments.target}
      healthy: true
  parameters:
    resource_id:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    target:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
  preflight:
  - id: approved-state
    capability: netopyu.tool.mock_operation_status
    arguments:
      resource_id: ${arguments.resource_id}
    snapshotFields:
    - facts
    predicates:
    - field: facts
      operator: exists
  verification:
    capability: netopyu.verifier.mock-state
    arguments:
      resource_id: ${arguments.resource_id}
    predicates:
    - field: passed
      operator: equals
      expected: true
  compensation: null
  approval:
    required: true
    risk: high
    mode: single
  failurePolicy:
    beforeSend: abort
    afterSendUnknown: reconcile_read_only
    verificationFailed: manual_intervention
    compensationFailed: manual_intervention
