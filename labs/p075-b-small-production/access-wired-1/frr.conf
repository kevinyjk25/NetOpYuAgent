frr version 10.3
frr defaults traditional
hostname access-wired-1
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description SALES_VLAN20_ERIN
 ip address 10.10.20.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth2
 description SUPPORT_VLAN30_BOB
 ip address 10.10.30.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth3
 description OPERATIONS_VLAN60
 ip address 10.10.60.1/24
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth4
 description PRIMARY_TO_CORE1
 ip address 10.0.0.1/30
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf hello-interval 3
 ip ospf dead-interval 12
!
interface eth5
 description BACKUP_TO_CORE2
 ip address 10.0.0.5/30
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf hello-interval 3
 ip ospf dead-interval 12
!
router ospf
 ospf router-id 1.1.1.1
!
