# pre-commit framework config — install once per dev machine:
#   pip install pre-commit
#   pre-commit install
#
# Runs audits before each `git commit` so bad code never enters the
# repo locally. Same checks the CI enforces, just earlier.
#
# `pre-commit run --all-files` runs against the whole repo on demand.

repos:
  - repo: local
    hooks:
      - id: static-audits
        name: Static audits (syntax + imports + wiring + directive parsing)
        # We invoke the precheck script with --audits so the SAME entry
        # point runs locally and in CI. Diverging the two leads to
        # "passes locally, fails CI" frustration.
        entry: bash scripts/precheck.sh --audits
        language: system
        # Audits read .py files anywhere; trigger on any python change.
        files: \.py$
        # Run once for the whole commit, not per-file.
        pass_filenames: false
