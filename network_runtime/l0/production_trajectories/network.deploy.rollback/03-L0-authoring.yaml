apiVersion: netopyu.io/l0-effect/v2
kind: AtomicEffect
metadata:
  id: network.deploy.rollback
  version: 1.0.0
  owner: netopyu-runtime
  description: Production L0 v2 contract for rollback_deploy
  labels:
    runtime-tool-contract: mock-rollback-deploy-v2
    runtime-verifier: mock-state
    runtime-preflight-fields: deploy_id
    migration-source: l0-v1-reviewed
spec:
  template: netopyu-runtime-v2
  profiles:
  - lan
  effect:
    capability: netopyu.tool.rollback_deploy
    tool: rollback_deploy
    request:
      deploy_id: ${arguments.deploy_id}
      scope: ${arguments.scope}
  intent:
    kind: rollback_deployment
    targetFields:
    - deploy_id
    desiredState:
      rolled_back: true
      services_healthy: true
  parameters:
    deploy_id:
      type: string
      required: true
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
    scope:
      type: string
      required: false
      description: ''
      enum: []
      minimum: null
      maximum: null
      minLength: null
      maxLength: 4096
      pattern: null
      resolver: null
      fixed: null
      sensitive: false
  preflight:
  - id: approved-state
    capability: netopyu.tool.mock_operation_status
    arguments:
      deploy_id: ${arguments.deploy_id}
    snapshotFields:
    - facts
    predicates:
    - field: facts
      operator: exists
  verification:
    capability: netopyu.verifier.mock-state
    arguments:
      deploy_id: ${arguments.deploy_id}
    predicates:
    - field: passed
      operator: equals
      expected: true
  compensation: null
  approval:
    required: true
    risk: high
    mode: single
  failurePolicy:
    beforeSend: abort
    afterSendUnknown: reconcile_read_only
    verificationFailed: manual_intervention
    compensationFailed: manual_intervention
